[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamesense-prediction"
version = "0.1.0"
description = "Prediction service for the GameSense application"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn",
    "jsonschema[format]==4.26.0",
    "referencing>=0.37.0,<0.38",
    "numpy>=2,<3",
    "scikit-learn>=1.6,<2",
    "xgboost>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
    "ruff==0.15.7",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gamesense_prediction*"]

[tool.setuptools.package-data]
gamesense_prediction = ["resources/*.json", "models/*/README.md", "models/*/*.schema.json"]

[tool.setuptools.data-files]
"share/gamesense/schemas" = ["../shared/schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
