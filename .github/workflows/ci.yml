name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-metadata:
    name: Validate PR metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    # Ensures branches follow the naming convention using regular expressions.
    steps:
      - name: Validate branch name
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH_NAME" =~ ^tickets/[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "Invalid branch name: $BRANCH_NAME"
            echo "Expected format: tickets/<number>-<description>"
            echo "Example: tickets/3-create-readme"
            exit 1
          fi

  validate-python:
    name: Validate Python
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: prediction

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.1"

      - name: Install prediction service and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Python tests
        run: python -m pytest

      - name: Run Ruff linting
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .

  validate-java:
    name: Validate Java
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run Java tests
        run: ./mvnw test

      - name: Run Checkstyle
        run: ./mvnw checkstyle:check

      - name: Check Spotless formatting
        run: ./mvnw spotless:check

      - name: Run Maven verification
        run: ./mvnw verify -DskipTests
        