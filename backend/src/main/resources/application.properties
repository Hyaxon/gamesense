spring.application.name=backend
server.port=8080

# Current-season data source (mentor-provided feed). Override with GAMESENSE_DATASOURCE_URL etc.
gamesense.datasource.url=http://www.pepplerstats.com/Capstone/API/?SPORT=NCAAF&TYPE=JSON
gamesense.datasource.connect-timeout=5s
gamesense.datasource.read-timeout=30s
# Python prediction service; override these defaults through environment variables.
prediction.service.base-url=${PREDICTION_SERVICE_BASE_URL:http://127.0.0.1:8000}
prediction.service.connect-timeout=${PREDICTION_SERVICE_CONNECT_TIMEOUT:2s}
prediction.service.request-timeout=${PREDICTION_SERVICE_REQUEST_TIMEOUT:30s}

# Runs the configured models against the published snapshot. Set false to skip predictions.
prediction.orchestration.enabled=${PREDICTION_ORCHESTRATION_ENABLED:true}
# Models to run for each prediction; each model-id must be registered in the Python service.
# XGBoost (xgboost-v1) is left out because Python registers it only when a trained artifact
# is configured; see prediction/README.md to add it.
prediction.orchestration.models[0].model-id=elo-v1
prediction.orchestration.models[0].execution-kind=DETERMINISTIC
prediction.orchestration.models[1].model-id=glicko2
prediction.orchestration.models[1].execution-kind=DETERMINISTIC
prediction.orchestration.models[2].model-id=bradley-terry-v1
prediction.orchestration.models[2].execution-kind=DETERMINISTIC
prediction.orchestration.models[3].model-id=monte-carlo-v1
prediction.orchestration.models[3].execution-kind=SIMULATION
prediction.orchestration.models[3].trials=10000
prediction.orchestration.models[4].model-id=coin-flip-v1
prediction.orchestration.models[4].execution-kind=SIMULATION
prediction.orchestration.models[4].trials=1000

# Disable startup ingestion for environments that supply their own data.
gamesense.ingestion.enabled=${GAMESENSE_INGESTION_ENABLED:true}
# Use file:/absolute/path/Schedule.json to override the packaged historical dataset.
gamesense.ingestion.historical-location=${GAMESENSE_INGESTION_HISTORICAL_LOCATION:classpath:historical/Schedule-2025.json}

# Publish ingested live-season data to Python at startup. Failures do not stop the backend.
prediction.snapshot.publish.enabled=${PREDICTION_SNAPSHOT_PUBLISH_ENABLED:true}
# Optional file-based fallback; configure both values to match a snapshot loaded by Python.
prediction.snapshot.fallback-season=${PREDICTION_SNAPSHOT_FALLBACK_SEASON:0}
prediction.snapshot.fallback-id=${PREDICTION_SNAPSHOT_FALLBACK_ID:}
