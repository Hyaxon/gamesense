spring.application.name=backend
server.port=8080

# Current-season data source (mentor-provided feed). Override with GAMESENSE_DATASOURCE_URL etc.
gamesense.datasource.url=http://www.pepplerstats.com/Capstone/API/?SPORT=NCAAF&TYPE=JSON
gamesense.datasource.connect-timeout=5s
gamesense.datasource.read-timeout=30s
# Python prediction service; override these defaults through environment variables.
prediction.service.base-url=${PREDICTION_SERVICE_BASE_URL:http://127.0.0.1:8000}
prediction.service.connect-timeout=${PREDICTION_SERVICE_CONNECT_TIMEOUT:2s}
prediction.service.request-timeout=${PREDICTION_SERVICE_REQUEST_TIMEOUT:30s}

# Enable after supplying a canonical PredictionDataProvider bean and model selections.
prediction.orchestration.enabled=${PREDICTION_ORCHESTRATION_ENABLED:false}

# Disable startup ingestion for environments that supply their own data.
gamesense.ingestion.enabled=${GAMESENSE_INGESTION_ENABLED:true}
